<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      html {
        background-color: #f0f0f0;
        display: flex;
      }
      :root {
        --canvas-size: 1024px;
      }
      body {
        container-type: inline-size;

        width: var(--canvas-size);
        height: var(--canvas-size);
        margin: 0;
        padding: 4.68cqi;
        box-sizing: border-box;

        background-image: url('{{bgBase64Url}}');
        background-size: 100% 100%;
        background-position: center;
        background-repeat: no-repeat;
        overflow: clip;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        font-family: 'Helvetica Neue', Arial, sans-serif;
      }

      .content-stack {
        display: flex;
        flex-direction: column;
        gap: 4.6cqi;
        align-items: center;
        text-align: center;
        max-width: 100%;
        height: 100%;
        width: 100%;
      }

      h1 {
        margin: 0;
        font-size: 6.25cqi;
        color: #2d3748;
        line-height: 1.2;
        padding-top: 7.5cqi;
      }

      p {
        margin: 0;
        font-size: 3.8cqi;
        color: #4a5568;
        line-height: 1.5;
        margin-left: 8cqi;
        margin-right: 8cqi;
        text-align: justify;
      }
    </style>
  </head>
  <body>
    <div class="content-stack">
      <h1>商家簡介</h1>
      <p>{{shopDescription}}</p>
    </div>
  </body>
</html>
